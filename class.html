<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="class.css">
    </head>
    <body>
           <h1>Class Sign Up!</h1>
           <div id="choice">
               <button class="choice-size">Paint</button>
               <button class="choice-size">Art</button>
               <button class="choice-size">Craft</button>
           </div>
           <div id="all">
             <div id="name">
              <p>Name:</p>
              <input type="Name"
             </div>   
             <div id="Age">
              <p>Age:</p>
              <button>5-7</button>
              <button>8-12</button>
              <button>13-17</button>
              <button>18 or above</button>
             </div> 
             <div>
                <p>Day:</p>
                <button>Mon</button>
                <button>Tue</button>
                <button>Wed</button>
                <button>Thur</button>
                <button>Fri</button>
                <button>Sat</button>
                <button>Sun</button>
             </div>
           </div>                                                                       
    </body>
</html>
